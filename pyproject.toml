[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pneuma-edge-unified"
version = "0.2.0"
description = "PNEUMA-Edge with optional archetypal hypothesis layer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26.0", "rich>=13.7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pneuma_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
